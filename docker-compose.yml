# Local Postgres and Redis for development and tests. Kept apart from the Dox Box local stack
# (different ports), since Deadline isn't part of Dox Box.
services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_USER: deadline
            POSTGRES_PASSWORD: deadline
            POSTGRES_DB: deadline
        ports:
            - '127.0.0.1:5433:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
            # Makes the deadline_test database the tests use
            - ./scripts/test-db.sql:/docker-entrypoint-initdb.d/test-db.sql:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U deadline']
            interval: 5s
            retries: 10

    redis:
        image: redis:7
        ports:
            - '127.0.0.1:6380:6379'

volumes:
    postgres_data:
